<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7B1E3A" />
    <title>Çevrimdışı · Disiplin</title>
    <style>
      :root {
        color-scheme: only light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.25rem;
        background: #ffffff;
        color: #1c1a1b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 0;
        font-family: ui-serif, Georgia, serif;
        font-size: 1.3rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 0.925rem;
        line-height: 1.55;
        color: #8a8285;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: #7b1e3a;
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 0.85rem 1.75rem;
        cursor: pointer;
      }
      button:hover {
        background: #5e1229;
      }
    </style>
  </head>
  <body>
    <img src="/ikon-192.png" alt="" />
    <h1>İnternet yok</h1>
    <p>
      Disiplin görevlerini her seferinde canlı çeker, bu yüzden bağlantı
      olmadan açılmaz. Bağlandığında kaldığın yerden devam edersin.
    </p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </body>
</html>
